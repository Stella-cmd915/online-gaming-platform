# ============================================================
# Distributed Online Gaming System - Configuration
# ============================================================

# Master server
master.host=localhost
master.port=5000
# Port on which Master listens for Reducer results (MapReduce callback)
master.reducer.callback.port=5006

# Reducer server
reducer.host=localhost
reducer.port=5004

# Secure Random Generator server
randomgenerator.host=localhost
randomgenerator.port=5005

# Number of Worker nodes
worker.count=3

# Worker 0
worker.0.host=localhost
worker.0.port=5001

# Worker 1
worker.1.host=localhost
worker.1.port=5002

# Worker 2
worker.2.host=localhost
worker.2.port=5003

# Producer-consumer buffer size per game (in the SRG)
buffer.size=50

# MapReduce result wait timeout (milliseconds)
mapreduce.timeout.ms=30000
